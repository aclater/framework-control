name: Build and Release Service MSI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  read-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read_version.outputs.version }}
      is_prerelease: ${{ steps.read_version.outputs.is_prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Read version
        id: read_version
        shell: bash
        run: |
          set -euo pipefail
          current=$(grep -m1 '^version\s*=' service/Cargo.toml | sed -E 's/^version\s*=\s*"([^"]+)".*/\1/')
          isPrerelease=true
          if [ "${GITHUB_REF_NAME}" = "main" ] && { [ "${GITHUB_EVENT_NAME}" = "push" ] || [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; }; then
            isPrerelease=false
          fi
          echo "version=$current" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=$isPrerelease" >> "$GITHUB_OUTPUT"

  create-release:
    needs: read-version
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.manage_release.outputs.should_release }}
      promoted_stable: ${{ steps.manage_release.outputs.promoted_stable }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Create GitHub release
        id: manage_release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.read-version.outputs.version }}
          IS_PRERELEASE: ${{ needs.read-version.outputs.is_prerelease }}
        run: |
          set -euo pipefail
          tag="$VERSION"
          changelogPath="CHANGELOG.md"
          defaultBody="Refer to the CHANGELOG.md for information about version $VERSION."
          body="$defaultBody"

          if [ -f "$changelogPath" ]; then
            # Extract version section from changelog
            section=$(awk "/^## $VERSION(\$| )/{flag=1; next} /^## /{flag=0} flag" "$changelogPath" || echo "")
            if [ -n "$section" ]; then
              body="$section"
            fi
          fi

          prereleaseFlag="--prerelease"
          [ "$IS_PRERELEASE" = "false" ] && prereleaseFlag="--prerelease=false --latest"

          existingIsPrerelease=$(gh release view "$tag" --json isPrerelease -q '.isPrerelease' 2>/dev/null || echo "notfound")

          if [ "$IS_PRERELEASE" = "true" ] && [ "$existingIsPrerelease" = "false" ]; then
            echo "Release $tag is already live, skipping pre-release run"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "promoted_stable=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$IS_PRERELEASE" = "false" ] && [ "$existingIsPrerelease" = "false" ]; then
            echo "Release $tag is already stable, skipping rebuild"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "promoted_stable=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          promotedStable=false
          if [ "$IS_PRERELEASE" = "false" ] && [ "$existingIsPrerelease" != "false" ]; then
            promotedStable=true
          fi

          if [ "$existingIsPrerelease" = "notfound" ]; then
            gh release create "$tag" -t "Framework Control v$VERSION" -n "$body" $prereleaseFlag --target "$GITHUB_SHA"
            echo "Created release $tag"
          else
            gh release edit "$tag" -t "Framework Control v$VERSION" -n "$body" $prereleaseFlag
            echo "Updated existing release $tag"
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --silent 2>/dev/null; then
              if [ "$IS_PRERELEASE" = "true" ] || [ "$promotedStable" = "true" ]; then
                gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag" -f sha="$GITHUB_SHA" -F force=true
                echo "Moved tag $tag to $GITHUB_SHA"
              fi
            fi
          fi

          echo "should_release=true" >> "$GITHUB_OUTPUT"
          echo "promoted_stable=$promotedStable" >> "$GITHUB_OUTPUT"

  build-msi:
    needs: [read-version, create-release]
    if: needs.create-release.outputs.should_release == 'true'
    runs-on: windows-latest
    defaults:
      run:
        working-directory: service
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            service/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('service/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install WiX Toolset
        run: choco install wixtoolset --no-progress -y

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Build MSI
        run: node scripts/build-msi.mjs
        env:
          GITHUB_PAGES: "false"
          VITE_BASE: "/"
          VITE_API_BASE: ${{ secrets.VITE_API_BASE || vars.VITE_API_BASE }}
          FRAMEWORK_CONTROL_PORT: ${{ secrets.FRAMEWORK_CONTROL_PORT || vars.FRAMEWORK_CONTROL_PORT }}
          FRAMEWORK_CONTROL_ALLOWED_ORIGINS: ${{ secrets.FRAMEWORK_CONTROL_ALLOWED_ORIGINS || vars.FRAMEWORK_CONTROL_ALLOWED_ORIGINS }}
          FRAMEWORK_CONTROL_UPDATE_REPO: ${{ secrets.FRAMEWORK_CONTROL_UPDATE_REPO || vars.FRAMEWORK_CONTROL_UPDATE_REPO }}
          # Pre-releases read the dev branch announcement; empty falls back to main.
          VITE_ANNOUNCEMENT_URL: ${{ needs.read-version.outputs.is_prerelease == 'true' && 'https://raw.githubusercontent.com/ozturkkl/framework-control/dev/ANNOUNCEMENT.md' || '' }}
        working-directory: web

      - name: Locate MSI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $msi = Get-ChildItem -Path "target/wix" -Filter *.msi | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $msi) { throw "MSI not found in target/wix" }
          echo "MSI_PATH=$($msi.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "STABLE_NAME=framework-control-service-x86_64.msi" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Create stable-named copy for upload
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stable = Join-Path $env:RUNNER_TEMP $env:STABLE_NAME
          Copy-Item -Path "$env:MSI_PATH" -Destination "$stable" -Force
          echo "STABLE_PATH=$stable" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Generate MSI SHA256
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $hash = (Get-FileHash "$env:STABLE_PATH" -Algorithm SHA256).Hash.ToLower()
          $shaFile = Join-Path $env:RUNNER_TEMP "msi.sha256"
          "$hash *$env:STABLE_NAME" | Out-File -FilePath $shaFile -Encoding ASCII
          echo "MSI_SHA_PATH=$shaFile" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload MSI and its SHA to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.read-version.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = "$env:VERSION"
          gh release upload $tag "$env:STABLE_PATH" --clobber
          gh release upload $tag "$env:MSI_SHA_PATH" --clobber

  build-linux:
    needs: [read-version, create-release]
    if: needs.create-release.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: service
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Cache Cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            service/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('service/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install musl-tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Build Linux tarball
        run: node scripts/build-linux.mjs
        env:
          STATIC_BUILD: "true"
          GITHUB_PAGES: "false"
          VITE_BASE: "/"
          VITE_API_BASE: ${{ secrets.VITE_API_BASE || vars.VITE_API_BASE }}
          FRAMEWORK_CONTROL_PORT: ${{ secrets.FRAMEWORK_CONTROL_PORT || vars.FRAMEWORK_CONTROL_PORT }}
          FRAMEWORK_CONTROL_ALLOWED_ORIGINS: ${{ secrets.FRAMEWORK_CONTROL_ALLOWED_ORIGINS || vars.FRAMEWORK_CONTROL_ALLOWED_ORIGINS }}
          FRAMEWORK_CONTROL_UPDATE_REPO: ${{ secrets.FRAMEWORK_CONTROL_UPDATE_REPO || vars.FRAMEWORK_CONTROL_UPDATE_REPO }}
          VITE_ANNOUNCEMENT_URL: ${{ needs.read-version.outputs.is_prerelease == 'true' && 'https://raw.githubusercontent.com/ozturkkl/framework-control/dev/ANNOUNCEMENT.md' || '' }}
        working-directory: web

      - name: Locate tarball
        shell: bash
        env:
          VERSION: ${{ needs.read-version.outputs.version }}
        run: |
          set -euo pipefail
          tarballName="framework-control-${VERSION}-linux-x86_64.tar.gz"
          tarballPath="target/$tarballName"
          if [ ! -f "$tarballPath" ]; then
            echo "Tarball not found: $tarballPath"
            exit 1
          fi
          echo "TARBALL_PATH=$tarballPath" >> "$GITHUB_ENV"
          echo "STABLE_NAME=framework-control-service-x86_64.tar.gz" >> "$GITHUB_ENV"
          echo "Found tarball: $tarballPath"

      - name: Create stable-named copy for upload
        shell: bash
        run: |
          set -euo pipefail
          stablePath="$RUNNER_TEMP/$STABLE_NAME"
          cp "$TARBALL_PATH" "$stablePath"
          echo "STABLE_PATH=$stablePath" >> "$GITHUB_ENV"

      - name: Generate tarball SHA256
        shell: bash
        run: |
          set -euo pipefail
          hash=$(sha256sum "$STABLE_PATH" | awk '{print $1}')
          shaFile="$RUNNER_TEMP/tarball.sha256"
          echo "$hash *$STABLE_NAME" > "$shaFile"
          echo "TARBALL_SHA_PATH=$shaFile" >> "$GITHUB_ENV"

      - name: Upload tarball and its SHA to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.read-version.outputs.version }}
        run: |
          set -euo pipefail
          tag="$VERSION"
          gh release upload "$tag" "$STABLE_PATH" --clobber
          gh release upload "$tag" "$TARBALL_SHA_PATH" --clobber

  build-rpm:
    needs: [read-version, create-release]
    if: needs.create-release.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Supported targets; each gets its own framework-control-service-x86_64.<dist>.rpm
        include:
          - dist: fc43
            image: quay.io/fedora/fedora:43
          - dist: fc44
            image: quay.io/fedora/fedora:44
          # Red Hat Universal Base Image: real RHEL content, no subscription needed.
          # No RHEL 9: Framework's framework_tool release binary needs glibc 2.38.
          - dist: el10
            image: registry.access.redhat.com/ubi10/ubi:latest
    container: ${{ matrix.image }}
    steps:
      - name: Install tools
        run: dnf install -y git rpm-build cargo gcc nodejs npm systemd-rpm-macros

      - name: Checkout
        uses: actions/checkout@v5

      - name: Build RPM
        shell: bash
        env:
          VERSION: ${{ needs.read-version.outputs.version }}
          IS_PRERELEASE: ${{ needs.read-version.outputs.is_prerelease }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          topDir="$RUNNER_TEMP/rpmbuild"
          mkdir -p "$topDir/SOURCES" "$topDir/SPECS"
          specPath="$topDir/SPECS/framework-control.spec"
          sed "s/^Version:.*/Version:        $VERSION/" rpm/framework-control.spec > "$specPath"
          git archive --prefix="framework-control-$VERSION/" -o "$topDir/SOURCES/framework-control-$VERSION.tar.gz" HEAD
          defines=(--define "_topdir $topDir")
          if [ "$IS_PRERELEASE" = "true" ]; then
            defines+=(--define "announcement_url https://raw.githubusercontent.com/ozturkkl/framework-control/dev/ANNOUNCEMENT.md")
          fi
          rpmbuild -bb "${defines[@]}" "$specPath"

      - name: Install package
        shell: bash
        run: |
          set -euo pipefail
          # Scriptlets call systemctl, which can't run in a container
          dnf install -y --setopt=tsflags=noscripts "$RUNNER_TEMP"/rpmbuild/RPMS/x86_64/framework-control-*.rpm
          rpm -V framework-control
          test -x /usr/bin/framework-control

      - name: Create stable-named copy
        shell: bash
        env:
          DIST: ${{ matrix.dist }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/out"
          cp "$RUNNER_TEMP"/rpmbuild/RPMS/x86_64/framework-control-*.rpm "$RUNNER_TEMP/out/framework-control-service-x86_64.$DIST.rpm"

      - name: Upload RPM artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpm-${{ matrix.dist }}
          path: ${{ runner.temp }}/out/*.rpm
          if-no-files-found: error

  # UBI has no gh CLI, so the release upload runs on the plain runner
  publish-rpm:
    needs: [read-version, build-rpm]
    runs-on: ubuntu-latest
    steps:
      - name: Download RPM artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: rpm-*
          path: ${{ runner.temp }}/rpms
          merge-multiple: true

      - name: Upload RPMs and their SHA to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.read-version.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="$VERSION"
          cd "$RUNNER_TEMP/rpms"
          shaFile="$RUNNER_TEMP/rpm.sha256"
          : > "$shaFile"
          for rpm in framework-control-service-x86_64.*.rpm; do
            echo "$(sha256sum "$rpm" | awk '{print $1}') *$rpm" >> "$shaFile"
            gh release upload "$tag" "$rpm" --clobber -R "$REPO"
          done
          gh release upload "$tag" "$shaFile" --clobber -R "$REPO"

  create-sha256sums:
    needs: [read-version, build-msi, build-linux, publish-rpm]
    if: needs.build-msi.result == 'success' && needs.build-linux.result == 'success' && needs.publish-rpm.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Download individual SHA files and create SHA256SUMS
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.read-version.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="$VERSION"

          # Download the individual SHA files
          gh release download "$tag" -p "*.sha256" -D "$RUNNER_TEMP" -R "$REPO"

          # Combine into SHA256SUMS
          cat "$RUNNER_TEMP"/*.sha256 > "$RUNNER_TEMP/SHA256SUMS"

          # Upload SHA256SUMS
          gh release upload "$tag" "$RUNNER_TEMP/SHA256SUMS" --clobber -R "$REPO"

          # Clean up individual SHA files from release
          gh release delete-asset "$tag" msi.sha256 --yes -R "$REPO" || true
          gh release delete-asset "$tag" tarball.sha256 --yes -R "$REPO" || true
          gh release delete-asset "$tag" rpm.sha256 --yes -R "$REPO" || true

          echo "Created SHA256SUMS with all hashes"

  publish-aur:
    needs: [read-version, create-release, build-linux]
    if: needs.create-release.outputs.promoted_stable == 'true' && needs.build-linux.result == 'success'
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install tools
        run: pacman -Syu --noconfirm --needed git openssh pacman-contrib

      - name: Update PKGBUILD and generate .SRCINFO
        shell: bash
        env:
          VERSION: ${{ needs.read-version.outputs.version }}
        run: |
          set -euo pipefail
          pkgDir=aur
          cd "$pkgDir"
          sed -i "s/^pkgver=.*/pkgver=$VERSION/" PKGBUILD
          sed -i "s/^pkgrel=.*/pkgrel=1/" PKGBUILD
          # makepkg refuses to run as root; use a throwaway build user
          useradd -m builder
          chown -R builder .
          runuser -u builder -- updpkgsums
          runuser -u builder -- makepkg --printsrcinfo > .SRCINFO

      - name: Build and install package
        shell: bash
        run: |
          set -euo pipefail
          cd aur
          depsLine=$(source PKGBUILD && echo "${depends[@]}" "${makedepends[@]}")
          read -ra deps <<< "$depsLine"
          pacman -S --noconfirm --needed "${deps[@]}"
          runuser -u builder -- makepkg --noconfirm
          # Scriptlets call systemctl, which can't run in a container
          pacman -U --noconfirm --noscriptlet ./*.pkg.tar.zst

      - name: Push to AUR
        shell: bash
        env:
          VERSION: ${{ needs.read-version.outputs.version }}
          AUR_USERNAME: ${{ secrets.AUR_USERNAME }}
          AUR_EMAIL: ${{ secrets.AUR_EMAIL }}
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          pkgDir=aur
          aurDir="$RUNNER_TEMP/aur"
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > "$HOME/.ssh/aur_key"
          chmod 600 "$HOME/.ssh/aur_key"
          ssh-keyscan aur.archlinux.org >> "$HOME/.ssh/known_hosts"
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/aur_key -o UserKnownHostsFile=$HOME/.ssh/known_hosts"

          git clone ssh://aur@aur.archlinux.org/framework-control.git "$aurDir"
          cp "$pkgDir/PKGBUILD" "$pkgDir/.SRCINFO" "$pkgDir/framework-control.install" "$aurDir/"

          cd "$aurDir"
          git config user.name "$AUR_USERNAME"
          git config user.email "$AUR_EMAIL"
          git add -A
          if git diff --cached --quiet; then
            echo "AUR package already up to date"
            exit 0
          fi
          git commit -m "Update to $VERSION"
          git push origin master

  publish-aur-beta:
    needs: [read-version, create-release, build-linux]
    if: needs.create-release.outputs.should_release == 'true' && needs.read-version.outputs.is_prerelease == 'true' && needs.build-linux.result == 'success'
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install tools
        run: pacman -Syu --noconfirm --needed git openssh pacman-contrib

      - name: Update PKGBUILD and generate .SRCINFO
        shell: bash
        env:
          VERSION: ${{ needs.read-version.outputs.version }}
          AUR_USERNAME: ${{ secrets.AUR_USERNAME }}
          AUR_EMAIL: ${{ secrets.AUR_EMAIL }}
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > "$HOME/.ssh/aur_key"
          chmod 600 "$HOME/.ssh/aur_key"
          ssh-keyscan aur.archlinux.org >> "$HOME/.ssh/known_hosts"
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/aur_key -o UserKnownHostsFile=$HOME/.ssh/known_hosts"

          aurRemote="$RUNNER_TEMP/aur-remote"
          git clone ssh://aur@aur.archlinux.org/framework-control-beta.git "$aurRemote"

          pkgrel=1
          if [ -f "$aurRemote/PKGBUILD" ]; then
            aurPkgver=$(grep '^pkgver=' "$aurRemote/PKGBUILD" | cut -d= -f2)
            aurPkgrel=$(grep '^pkgrel=' "$aurRemote/PKGBUILD" | cut -d= -f2)
            if [ "$aurPkgver" = "$VERSION" ]; then
              pkgrel=$((aurPkgrel + 1))
            fi
          fi
          echo "pkgrel=$pkgrel" >> "$GITHUB_ENV"

          pkgDir=aur-beta
          cd "$pkgDir"
          sed -i "s/^pkgver=.*/pkgver=$VERSION/" PKGBUILD
          sed -i "s/^pkgrel=.*/pkgrel=$pkgrel/" PKGBUILD
          # makepkg refuses to run as root; use a throwaway build user
          useradd -m builder
          chown -R builder .
          runuser -u builder -- updpkgsums
          runuser -u builder -- makepkg --printsrcinfo > .SRCINFO

      - name: Build and install package
        shell: bash
        run: |
          set -euo pipefail
          cd aur-beta
          depsLine=$(source PKGBUILD && echo "${depends[@]}" "${makedepends[@]}")
          read -ra deps <<< "$depsLine"
          pacman -S --noconfirm --needed "${deps[@]}"
          runuser -u builder -- makepkg --noconfirm
          # Scriptlets call systemctl, which can't run in a container
          pacman -U --noconfirm --noscriptlet ./*.pkg.tar.zst

      - name: Push to AUR
        shell: bash
        env:
          VERSION: ${{ needs.read-version.outputs.version }}
          AUR_USERNAME: ${{ secrets.AUR_USERNAME }}
          AUR_EMAIL: ${{ secrets.AUR_EMAIL }}
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          pkgDir=aur-beta
          aurDir="$RUNNER_TEMP/aur"
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > "$HOME/.ssh/aur_key"
          chmod 600 "$HOME/.ssh/aur_key"
          ssh-keyscan aur.archlinux.org >> "$HOME/.ssh/known_hosts"
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/aur_key -o UserKnownHostsFile=$HOME/.ssh/known_hosts"

          git clone ssh://aur@aur.archlinux.org/framework-control-beta.git "$aurDir"
          cp "$pkgDir/PKGBUILD" "$pkgDir/.SRCINFO" "$pkgDir/framework-control-beta.install" "$aurDir/"

          cd "$aurDir"
          git config user.name "$AUR_USERNAME"
          git config user.email "$AUR_EMAIL"
          git add -A
          if git diff --cached --quiet; then
            echo "AUR package already up to date"
            exit 0
          fi
          git commit -m "Update to $VERSION-$pkgrel"
          git push origin master
